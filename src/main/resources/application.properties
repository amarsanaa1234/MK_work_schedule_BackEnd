spring.application.name=mk_backEnd
# MySQL шууд Windows дээр ажилладаг тул compose.yaml-ийн Docker auto-detection хэрэггүй
spring.docker.compose.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demo_schedule}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234Aa123}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://192.168.1.240:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB